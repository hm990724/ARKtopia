name: One-time branch cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  delete-obsolete-working-branch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Remove only the obsolete ARKtopia ChatGPT branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh api --method DELETE "repos/${REPOSITORY}/git/refs/heads/chatgpt/art-dialogue-gameplay-20261124" || {
            echo "Branch may already have been deleted"; exit 0;
          }
